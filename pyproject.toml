[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcplock"
version = "0.1.0"
description = "Catch breaking MCP tool changes before your agents do"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai-agents", "mcp", "model-context-protocol", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/wenn-id/mcplock"
Repository = "https://github.com/wenn-id/mcplock"
Issues = "https://github.com/wenn-id/mcplock/issues"

[project.scripts]
mcplock = "mcplock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcplock"]
